name: Verify Docs in Sync with Code

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 3am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          claude -p "Say hello" --allowedTools "" --max-turns 1 2>&1 || echo "Exit code: $?"
      - uses: miguel-vila/verify-docs-action@releases/v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          include: "AGENTS.md"
          verbose: "true"
          debug: "true"
